[Settings]
# Personal overrides for manual GitHub Actions playlist generation.
# Base defaults are inherited from config/config.ini.

# Display generated timestamps in Singapore time.
time_zone = Asia/Singapore

# Produce result.m3u alongside result.txt.
open_update = True
open_m3u_result = True
final_file = output/result.txt

# Keep this workflow as a one-shot playlist generator, not a live server.
open_service = False
open_rtmp = False

# Sources can be added to config/subscribe.txt and config/local.txt.
open_subscribe = True
open_local = True

# Default channel template. Change when you supply a custom channel list.
source_file = config/demo.txt
